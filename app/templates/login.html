<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Principal Login | {{ school_name }}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 32px 28px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .badge-icon {
      width: 52px;
      height: 52px;
      background: #1e3a8a;
      color: #fbbf24;
      font-weight: 800;
      font-size: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      border: 2px solid #3b82f6;
      margin-bottom: 12px;
    }

    .brand-header h1 {
      font-size: 18px;
      font-weight: 700;
      color: #fff;
    }

    .brand-header p {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 4px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      color: #cbd5e1;
      margin-bottom: 6px;
      font-weight: 500;
    }

    .form-group input {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      color: #fff;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      transition: border 0.2s;
    }

    .form-group input:focus {
      outline: none;
      border-color: #3b82f6;
    }

    .btn-submit {
      width: 100%;
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }

    .btn-submit:hover {
      background: #1d4ed8;
    }

    .error-box {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid #ef4444;
      color: #fca5a5;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }

    .scanner-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #38bdf8;
      text-decoration: none;
    }

    .scanner-link:hover {
      text-decoration: underline;
    }

    .hint {
      margin-top: 14px;
      text-align: center;
      font-size: 11px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand-header">
      <div class="badge-icon">SPHS</div>
      <h1>Shaheen Public High School</h1>
      <p>Loi Shalman • Principal Portal</p>
    </div>

    <div id="error-alert" class="error-box"></div>

    <form id="login-form">
      <div class="form-group">
        <label for="password">Principal Password</label>
        <input type="password" id="password" required autofocus placeholder="Enter password">
      </div>
      <button type="submit" class="btn-submit">Login to Dashboard</button>
    </form>

    <div class="hint">Default initial password: <code>admin123</code> (Changeable in settings)</div>
    <a href="/scanner" class="scanner-link">← Switch to Phone Scanner View</a>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const pwd = document.getElementById('password').value;
      const errBox = document.getElementById('error-alert');
      errBox.style.display = 'none';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pwd })
        });
        const data = await res.json();
        if (data.success) {
          window.location.href = '/admin';
        } else {
          errBox.textContent = data.message || 'Incorrect password';
          errBox.style.display = 'block';
        }
      } catch (err) {
        errBox.textContent = 'Server connection error';
        errBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
