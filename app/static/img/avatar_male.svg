<!-- Male Avatar SVG -->
<svg viewBox="0 0 140 140" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" style="display:block; width:100%; height:100%;">
  <defs>
    <linearGradient id="male-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="male-suit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a5c45"/>
      <stop offset="100%" stop-color="#044332"/>
    </linearGradient>
    <linearGradient id="male-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4a34b"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>
  <circle cx="70" cy="70" r="70" fill="url(#male-bg)"/>
  <!-- Blazer Uniform Shoulders -->
  <path d="M 14 140 C 18 110 38 96 70 96 C 102 96 122 110 126 140 Z" fill="url(#male-suit)"/>
  <!-- White shirt V-neck -->
  <polygon points="54,96 86,96 70,126" fill="#ffffff"/>
  <!-- School tie (Gold) -->
  <polygon points="67,98 73,98 75,104 70,128 65,104" fill="url(#male-gold)"/>
  <!-- White shirt collar flaps -->
  <polygon points="50,96 62,96 66,106 54,100" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
  <polygon points="90,96 78,96 74,106 86,100" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
  <!-- Neck -->
  <rect x="62" y="80" width="16" height="18" rx="4" fill="#fed7aa"/>
  <!-- Face -->
  <ellipse cx="70" cy="64" rx="25" ry="28" fill="#fed7aa"/>
  <!-- Neat School Hair Cut -->
  <path d="M 45 56 C 45 36 60 28 70 28 C 80 28 95 36 95 56 C 95 60 93 64 91 64 C 89 48 83 40 70 40 C 57 40 51 48 49 64 C 47 64 45 60 45 56 Z" fill="#1e293b"/>
  <!-- Eyebrows and eyes -->
  <path d="M 57 58 Q 62 56 66 58" stroke="#1e293b" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M 74 58 Q 78 56 83 58" stroke="#1e293b" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <circle cx="61.5" cy="63" r="2" fill="#1e293b"/>
  <circle cx="78.5" cy="63" r="2" fill="#1e293b"/>
  <!-- Friendly smile -->
  <path d="M 66 73 Q 70 76 74 73" stroke="#c2410c" stroke-width="1.6" fill="none" stroke-linecap="round"/>
</svg>
