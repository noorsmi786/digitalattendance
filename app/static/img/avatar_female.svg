<!-- Female Avatar SVG -->
<svg viewBox="0 0 140 140" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" style="display:block; width:100%; height:100%;">
  <defs>
    <linearGradient id="fem-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <linearGradient id="fem-hijab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a5c45"/>
      <stop offset="100%" stop-color="#044332"/>
    </linearGradient>
    <linearGradient id="fem-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="50%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>
  <circle cx="70" cy="70" r="70" fill="url(#fem-bg)"/>
  <!-- Draped Hijab Shoulders -->
  <path d="M 14 140 Q 20 102 70 100 Q 120 102 126 140 Z" fill="url(#fem-hijab)"/>
  <!-- Outer Hijab Head Veil -->
  <ellipse cx="70" cy="65" rx="38" ry="46" fill="url(#fem-hijab)"/>
  <!-- Gold Piping Along Veil Edge -->
  <path d="M 42 70 C 44 42 96 42 98 70 C 96 94 44 94 42 70 Z" fill="none" stroke="url(#fem-gold)" stroke-width="2.5"/>
  <!-- Face Opening -->
  <ellipse cx="70" cy="68" rx="25" ry="28" fill="#fed7aa"/>
  <!-- Hijab Forehead Inner Cap -->
  <path d="M 48 55 C 55 45 85 45 92 55 C 84 50 56 50 48 55 Z" fill="#044332"/>
  <!-- Stylized Eyes / Features -->
  <path d="M 58 67 Q 63 70 68 67" stroke="#9a3412" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M 72 67 Q 77 70 82 67" stroke="#9a3412" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M 67 76 Q 70 79 73 76" stroke="#c2410c" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Hijab Fold & Gold Pin -->
  <path d="M 58 108 L 70 125 L 82 108 Z" fill="#022c22" opacity="0.55"/>
  <circle cx="70" cy="108" r="4" fill="url(#fem-gold)"/>
</svg>
