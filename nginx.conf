# Nginx Reverse Proxy Configuration for Shaheen Public High School
# Place inside /etc/nginx/sites-available/attendance and symlink to sites-enabled

server {
    listen 80;
    server_name your-school-domain.com; # Or your Hostinger VPS IP address

    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /var/www/attendance/app/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
